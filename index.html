<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/calculator-backend.js" defer></script>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <p>Introduce dos números y elige una operación.</p>

    <form id="calculator-form" novalidate>
      <label for="number-a">Primer número</label>
      <input id="number-a" type="number" step="any" required>

      <label for="number-b">Segundo número</label>
      <input id="number-b" type="number" step="any" required>

      <label for="operation">Operación</label>
      <select id="operation">
        <option value="suma">Sumar</option>
        <option value="resta">Restar</option>
        <option value="multiplicacion">Multiplicar</option>
        <option value="division">Dividir</option>
      </select>

      <button id="calculate-button" type="submit">Calcular</button>
    </form>

    <p>Resultado: <output id="result" for="number-a number-b operation">—</output></p>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
